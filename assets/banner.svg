<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="F.E.E. – Paragraph gegen Richterhammer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5d47a"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8edf3"/>
      <stop offset="1" stop-color="#8b98a8"/>
    </linearGradient>
    <radialGradient id="clash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd24a"/>
      <stop offset="0.5" stop-color="#ff8c1a"/>
      <stop offset="1" stop-color="#ff8c1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="360" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="958" height="358" rx="18" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- Funken / Clash in der Mitte -->
  <circle cx="480" cy="170" r="110" fill="url(#clash)" opacity="0.55"/>
  <g stroke="#ffd24a" stroke-width="5" stroke-linecap="round">
    <line x1="470" y1="120" x2="452" y2="88"/>
    <line x1="490" y1="120" x2="508" y2="88"/>
    <line x1="448" y1="170" x2="410" y2="160"/>
    <line x1="512" y1="170" x2="550" y2="160"/>
    <line x1="462" y1="222" x2="440" y2="250"/>
    <line x1="498" y1="222" x2="520" y2="250"/>
  </g>
  <text x="480" y="188" text-anchor="middle" font-family="'DejaVu Sans', Arial, sans-serif" font-size="52" font-weight="800" fill="#ffd24a">VS</text>

  <!-- Paragraph (links) -->
  <text x="230" y="245" text-anchor="middle" font-family="'DejaVu Serif', Georgia, serif" font-size="220" font-weight="700" fill="url(#steel)">§</text>
  <!-- Bewegungslinien: Paragraph greift an -->
  <g stroke="#58a6ff" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <line x1="330" y1="120" x2="392" y2="104"/>
    <line x1="322" y1="170" x2="392" y2="160"/>
    <line x1="330" y1="220" x2="392" y2="216"/>
  </g>

  <!-- Richterhammer (rechts), als würde er zuschlagen -->
  <g transform="translate(560,110) rotate(28 100 60)">
    <!-- Stiel -->
    <rect x="88" y="52" width="150" height="18" rx="9" fill="#8a5a2b" transform="rotate(0 100 60)"/>
    <rect x="88" y="52" width="150" height="9" rx="5" fill="#a9713c"/>
    <!-- Hammerkopf -->
    <rect x="52" y="22" width="76" height="76" rx="14" fill="url(#gold)" stroke="#6b4a10" stroke-width="3"/>
    <rect x="52" y="22" width="76" height="26" rx="13" fill="#ffe9a8" opacity="0.6"/>
    <!-- Bänder -->
    <rect x="80" y="22" width="10" height="76" fill="#6b4a10" opacity="0.45"/>
    <rect x="92" y="22" width="10" height="76" fill="#6b4a10" opacity="0.45"/>
  </g>
  <!-- Bewegungslinien: Hammer schwingt -->
  <g stroke="#d29922" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <line x1="836" y1="150" x2="886" y2="120"/>
    <line x1="846" y1="196" x2="900" y2="184"/>
    <line x1="826" y1="242" x2="872" y2="252"/>
  </g>

  <!-- Impact-Sterne -->
  <g fill="#ffd24a">
    <path d="M418 96 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z"/>
    <path d="M540 240 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z"/>
  </g>

  <!-- Titel -->
  <text x="480" y="322" text-anchor="middle" font-family="'DejaVu Sans', Arial, sans-serif" font-size="30" font-weight="700" fill="#e8edf3">F.E.E. – Fully Examine Everything</text>
  <text x="480" y="348" text-anchor="middle" font-family="'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#8b98a8">Gesetze · Rechtsprechung · Verfahren · Vorabberatung</text>
</svg>
